<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../Css-files/style.css"> <!-- Link to the external CSS file for styling -->
    <script src="../Java-Script/carousel.js" defer></script> <!-- Link to the external JavaScript file for Carousel functionality -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osc International Dine In</title> <!-- Title of the webpage --> 
</head>
<body>
    <!--  HEADER  -->
    <header>
        <!-- Logo -->
        <div class="logo">
            <a href="../Html-files/Index.html">
                <img src="../Images/OSC-International-Dine-In-logo.png" alt="Osc International Dine In Logo">
            </a>
        </div>
        <!-- Navigation -->
        <div class="Navbar">
            <ul>
                <li><a href="../Html-files/Index.html">Home</a></li>
                <li><a href="../Html-files/Menu.html">Menu</a></li>
                <li><a href="../Html-files/Reservation.html">Reservation</a></li>
                <li><a href="../Html-files/Aboutus.html">About Us</a></li>
            </ul>
        </div>

    <main>
        <!-- Hero Section -->
        <section class="hero">
            <h1>Osc International Dine In</h1> <!-- Main heading of the webpage -->

            <div class="buttons">
                <button><a href="../Html-files/Menu.html">View menu</a></button>

            <button class="prev">&#10094;</button>

                <!-- Each image is a slide -->

                <img src="../Images/Steak-Frites-052.jpg" class="slide active" alt="Steak and Fries">
                <!-- Other slides start hidden -->
                <img src="../Images/Chicken-Tikka-Masala.jpeg" class="slide" alt="Chicken Tikka Masala">
                <img src="../Images/roasted-kumara-salad.jpg" class="slide" alt="Roasted Kūmara Salad">

            <!-- Right arrow button -->
            <button class="next">&#10095;</button>

    <footer>
        <div class="left">
            <p>Contact: info@restaurant.com | (123) 456-7890</p>

        </div>
        <div class="right">
            <p><a href="https://www.Facebook.com" target="_blank">Facebook</a> | <a href="https://www.instagram.com" target="_blank">Instagram</a> | <a href="https://www.twitter.com" target="_blank">Twitter</a></p>
