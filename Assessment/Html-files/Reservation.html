        </div>
        <h1>Make a Reservation</h1>
    </header>
    <main>
        <p>Please fill out the form below to make a reservation.</p>
        <form action="../Html-files/Reservationconfirmation.html" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="date">Date:</label>
            <input type="date" id="date" name="date" required>
            <label for="time">Time:</label>
            <input type="time" id="time" name="time" required>
            <label for="guests">Number of Guests:</label>
            <input type="number" id="guests" name="guests" min="1" max="26" required>
            <button type="submit">Submit Reservation</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Osc International Restaurant. All rights reserved.</p> <!-- Footer with copyright information -->
    </footer>
</body>
</html>
