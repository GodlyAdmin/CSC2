<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../Java-Script/Reservation.js" defer></script><!-- Link to the external JavaScript file for saving reservation data -->
    <link rel="stylesheet" href="../Css-files/style.css"> <!-- Link to the external CSS file for styling -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservations</title>
    <!-- Google Translate widget from Google classroom-->
     <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',  // Original language of your website
                includedLanguages: 'es,fr,de',  // Languages available for translation
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE  // Choose layout
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</head>
<body>
    <!--  HEADER  -->
    <header>
        <!-- Logo -->
        <div class="logo">
            <a href="../Html-files/Index.html">
                <img src="../Images/OSC-International-Dine-In-logo.png" alt="Osc International Dine In Logo">
            </a>
        </div>
        <!-- Navigation -->
        <div class="Navbar">
            <ul>
                <li><a href="../Html-files/Index.html">Home</a></li>
                <li><a href="../Html-files/Menu.html">Menu</a></li>
                <li><a href="../Html-files/Reservation.html">Reservation</a></li>
                <li><a href="../Html-files/Aboutus.html">About Us</a></li>
                <li><div id="google_translate_element"></div></li> <!-- Google Translate widget from google classroom-->
            </ul>
        </div>
    </header>
    <main class="reservation-page">
        <h1>Make a Reservation</h1>
        <div class="reservation-layout">
            <!-- left image -->
             <div class="side-image">
                <img src="../Images/restaurant-floorplanleftside.jpeg" alt="Restaurant Floor Plan Left Side">
             </div>
             <!-- Form -->
            <form class="booking-form" id="bookingForm" action="../Html-files/Reservationconfirmation.html" method="POST">
                <!--name input-->
                <label>Name</label>
                <input type="text" id="name" placeholder="Your full name" required>
                <!--date input-->
                <label for="date">Date</label>
                <input type="date" id="date" required>
                <!--time input-->
                <label for="time">Time</label>
                <input type="time" id="time" required>
                <!--guests input-->
                <label for="guests">Number of Guests</label>
                <input type="number" id="guests" min="1" required>
                <!--Special requests input-->
                <label for="requests">Special Requests</label>
                <textarea id="requests" placeholder="Any special requests or dietary restrictions..."></textarea>
                <!--submit button-->
                <button type="submit">Submit Reservation</button>
            </form>
            <!-- right image -->
            <div class="side-images">
                <img src="../Images/restaurant-floorplanrightside.jpeg" alt="Restaurant Floor Plan Right Side">
            </div>
        </div>
        <!--back link-->
        <a href="../Html-files/Index.html" class="back-link">← Back to Home</a>
    </main>
    <footer>
        <div class="left">
            <p>Contact: info@restaurant.com | (123) 456-7890</p>
            <p>275 Ormiston Road, Manakau City Centre, Auckland 2016</p>
            <p>
                <a href="https://jigsaw.w3.org/css-validator/check/referer" target="_blank">
                    <img style="border:0;width:88px;height:31px"
                        src="https://jigsaw.w3.org/css-validator/images/vcss"
                        alt="Valid CSS!" />
                </a>
            </p>
        </div>
        <div class="right">
            <p><a href="https://www.Facebook.com" target="_blank">Facebook</a> | <a href="https://www.instagram.com" target="_blank">Instagram</a> | <a href="https://www.twitter.com" target="_blank">Twitter</a></p>
        </div>
    </footer>
</body>
</html>
